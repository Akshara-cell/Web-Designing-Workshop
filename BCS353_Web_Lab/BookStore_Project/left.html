<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            border-right: 1px solid #cbd5e1;
            height: 100vh;
            padding: 25px 15px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 18px;
            padding-left: 10px;
        }
        ul { list-style: none; }
        li { margin-bottom: 12px; }
        a {
            display: block;
            padding: 12px 16px;
            background-color: white;
            color: #1e293b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            border-left: 4px solid #1e3a8a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            transition: all 0.25s ease;
        }
        a:hover {
            background-color: #1e3a8a;
            color: white;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }
    </style>
</head>
<body>
    <div class="sidebar-title">Departments</div>
    <ul>
        <li><a href="catalogue.html#cse" target="rightFrame">CSE Books</a></li>
        <li><a href="catalogue.html#ece" target="rightFrame">ECE Books</a></li>
        <li><a href="catalogue.html#eee" target="rightFrame">EEE Books</a></li>
        <li><a href="catalogue.html#civil" target="rightFrame">CIVIL Books</a></li>
    </ul>
</body>
</html>
